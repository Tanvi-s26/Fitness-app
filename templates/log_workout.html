{% extends "base.html" %}
{% block title %}Log Workout{% endblock %}
{% block content %}
<div class="form-container card">
  <h2>Log Workout 🏃</h2>
  <p class="subtitle">Record your training session</p>

  {% if success %}
  <div class="alert alert-success">{{ success }}</div>
  {% endif %}

  <form method="POST" action="/log-workout">
    <div class="form-group">
      <label>Workout Type</label>
      <select name="workout_type" required>
        <option value="">Select type...</option>
        <option value="Running">🏃 Running</option>
        <option value="Cycling">🚴 Cycling</option>
        <option value="Swimming">🏊 Swimming</option>
        <option value="Weight Training">🏋️ Weight Training</option>
        <option value="Yoga">🧘 Yoga</option>
        <option value="HIIT">⚡ HIIT</option>
        <option value="Walking">🚶 Walking</option>
      </select>
    </div>
    <div class="form-group">
      <label>Duration (minutes)</label>
      <input type="number" name="duration" placeholder="e.g. 45" min="1" required>
    </div>
    <div class="form-group">
      <label>Calories Burned</label>
      <input type="number" name="calories" placeholder="e.g. 350" min="1" required>
    </div>
    <div class="form-group">
      <label>Notes (optional)</label>
      <textarea name="notes" placeholder="How did it go?" rows="3"></textarea>
    </div>
    <button type="submit" class="btn">Save Workout 💪</button>
  </form>
</div>
{% endblock %}
