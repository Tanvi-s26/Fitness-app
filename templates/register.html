{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-container card">
  <h2>Create Account</h2>
  <p class="subtitle">Join FitTrack and start your journey</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/register">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="Enter email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Create password" required>
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>
  <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-muted);">
    Already have an account? <a href="/login" style="color:var(--primary);">Login</a>
  </p>
</div>
{% endblock %}
