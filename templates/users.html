{% extends "base.html" %}

{% block title %}Find Friends{% endblock %}

{% block content %}
<div class="section" style="max-width:600px; margin: 40px auto;">
    <h2>Find Friends 👥</h2>
    {% for user in users %}
    <div class="user-card">
        <strong>{{ user.username }}</strong>
        <span>{{ user.email }}</span>
        <a href="/follow/{{ user.id }}" class="btn-outline">Follow</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
